name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI Trusted Publishing (OIDC) — no token needed
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.11.32'
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
